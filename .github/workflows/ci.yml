# Runs on every push to main and on every pull request.
# Each job checks one part of the app; all must pass for CI to be green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests plus Testcontainers tests (GitHub runners have Docker built in).
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test # unit tests (Vitest)
      - run: npm run build

  data:
    name: Data (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Checks regions/exercises/equipment are consistent (no dependencies needed).
      - run: node data/validate.mjs

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  e2e:
    name: Browser tests (Cypress)
    runs-on: ubuntu-latest
    # Only spend minutes on browser tests when the faster checks pass.
    needs: [backend, frontend, data]
    steps:
      - uses: actions/checkout@v4
      - name: Start the app (database, backend, frontend)
        run: docker compose up --build -d
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Run the browser tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          wait-on: "http://localhost:8080/api/health, http://localhost:3000/login"
          wait-on-timeout: 180
      - name: Keep screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
      - name: Show the app logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail 200
